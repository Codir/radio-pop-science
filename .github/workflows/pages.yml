# .github/workflows/pages.yml
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # manual re-run from the Actions tab

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read           # actions/configure-pages reads the Pages site: GET /repos/{owner}/{repo}/pages
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # pnpm comes from corepack; its version is pinned in app/package.json → "packageManager": "pnpm@12.18.0".
      # Every pnpm call runs in app/ (there is no package.json at the repository root).
      - name: pnpm
        run: corepack enable

      - name: Install
        working-directory: app
        run: pnpm install --frozen-lockfile

      # Checks on the full tree
      - name: Types
        working-directory: app
        run: pnpm typecheck

      - name: Lint
        working-directory: app
        run: pnpm lint

      - name: Unit tests
        working-directory: app
        # the runner has 4 cores: the long simulation tests take several times longer here than on a developer's
        # machine and cross vitest's default limit of 5 s per test (first run: circuit/shared/copper counter.test.ts)
        run: pnpm test --testTimeout=30000

      - name: Documents
        run: |
          python3 tools/content/doccheck.py --all
          python3 docs/volumes/radio/test_check.py
          python3 docs/volumes/radio/check.py

      - name: Pages settings
        id: pages
        uses: actions/configure-pages@v6

      # Site profile: pruned copy → tsc → vite build → served under the Pages base path → browser check
      - name: Site profile
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          # not on PATH: QA_CHROME stays unset and smoke.mjs uses /usr/bin/google-chrome
          QA_CHROME="$(command -v google-chrome)" && export QA_CHROME
          node tools/site/build.mjs --volume radio --out "$RUNNER_TEMP/site" --sub "${BASE_PATH#/}"

      # The volume electronics lives next to the volume radio under /electronics/: the same site profile, built into
      # that sub-directory and checked in the browser under its own sub-path. It comes after Site profile, whose
      # vite build empties $RUNNER_TEMP/site.
      - name: Electronics
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          # not on PATH: QA_CHROME stays unset and smoke.mjs uses /usr/bin/google-chrome
          QA_CHROME="$(command -v google-chrome)" && export QA_CHROME
          node tools/site/build.mjs --volume electronics --out "$RUNNER_TEMP/site/electronics" --sub "${BASE_PATH#/}/electronics"

      # «Ядерна алхімія» lives next to the volume under /nuclear/: the ready build kept in the branch gh-pages
      # (built from the branch nuclear-alchemy with base './', so it works under any sub-path). Copied as is.
      - name: Nuclear alchemy
        run: |
          git fetch --no-tags --depth=1 origin gh-pages
          mkdir -p "$RUNNER_TEMP/site/nuclear"
          git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/site/nuclear"
          test -f "$RUNNER_TEMP/site/nuclear/index.html"
          grep -q 'src="./assets/' "$RUNNER_TEMP/site/nuclear/index.html"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
